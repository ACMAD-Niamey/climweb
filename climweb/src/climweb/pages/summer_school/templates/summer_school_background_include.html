{% load wagtailcore_tags i18n %}

<div class="ss-section-heading">
    <h2>{% translate "Background" %}</h2>
</div>

{% if page.background_intro %}
    <div class="format-text">
        {{ page.background_intro|richtext }}
    </div>
{% endif %}

{% if page.background_items %}
    <div class="columns is-multiline ss-card-grid">
        {% for card in page.background_items %}
            {% include_block card %}
        {% endfor %}
    </div>
{% endif %}
