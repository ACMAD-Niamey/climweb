worker_processes auto;
error_log /var/log/nginx/error.log;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types text/plain text/css text/js text/xml text/javascript application/x-javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;
    gzip_disable "msie6";
    gzip_comp_level 6;

    client_max_body_size 4G;
    client_body_buffer_size 100M;

    large_client_header_buffers 16 2048k;

    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # NOTE: `set $upstream ...` + resolver is deliberate — it forces nginx to
    # re-resolve the container name at request time instead of failing to boot
    # when climweb_prod is briefly down during a deploy.

    # --- HTTP: ACME challenge + redirect everything to the canonical apex ---
    server {
        listen 80;
        listen [::]:80;
        server_name acmad.org www.acmad.org new.acmad.org;

        # Let's Encrypt HTTP-01 validation hits this over plain port 80 — it
        # must be served before the redirect below, or certbot renewals fail.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://acmad.org$request_uri;
        }
    }

    # --- HTTPS: www + legacy new.acmad.org → 301 to the canonical apex ---
    # Separate server_names so each presents its own valid certificate before
    # redirecting (a browser validates TLS *before* it sees the 301).
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name www.acmad.org;

        # Same cert as the apex — issue it with both SANs:
        #   certbot certonly --webroot -w /var/www/certbot -d acmad.org -d www.acmad.org
        ssl_certificate /etc/letsencrypt/live/acmad.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/acmad.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        return 301 https://acmad.org$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name new.acmad.org;

        # new.acmad.org keeps its existing, already-issued certificate.
        include /etc/nginx/ssl/ssl.conf;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        return 301 https://acmad.org$request_uri;
    }

    # --- HTTPS: acmad.org — the canonical site ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl ipv6only=on;
        http2 on;
        server_name acmad.org;

        ssl_certificate /etc/letsencrypt/live/acmad.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/acmad.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        proxy_busy_buffers_size 512k;
        proxy_buffers 4 512k;
        proxy_buffer_size 256k;

        resolver 127.0.0.11 valid=30s;

        location / {
            set $upstream climweb_prod:8000;

            proxy_pass http://$upstream;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /static/ {
            alias /wagtail_static/;
        }

        location /media/ {
            alias /wagtail_media/;
        }
    }
}
