<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;background:#f7f6f1;color:#17303a;font-family:Arial,sans-serif;line-height:1.55">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f6f1;padding:28px 12px"><tr><td align="center">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#fff;border:1px solid #dce4e5;border-radius:12px;overflow:hidden">
<tr><td style="padding:18px 28px;background:#071f2e;color:#fff;font-size:20px;font-weight:700">{% if logo_url %}<img src="{{ logo_url }}" width="180" alt="ACMAD" style="display:block;max-width:180px;max-height:80px;width:auto;height:auto;border:0">{% else %}ACMAD Staff Portal{% endif %}</td></tr>
<tr><td style="padding:30px 28px">
<p style="margin:0 0 18px">{{ greeting }}</p>
<h1 style="margin:0 0 12px;color:#0a2a37;font-size:24px;line-height:1.25">{{ headline }}</h1>
<p style="margin:0 0 22px;color:#60727a">{{ message }}</p>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 22px;border-collapse:collapse">{% for detail in details %}<tr><td style="padding:8px 10px;border-bottom:1px solid #e7ece9;color:#60727a;font-size:13px">{{ detail.label }}</td><td style="padding:8px 10px;border-bottom:1px solid #e7ece9;font-weight:600">{{ detail.value }}</td></tr>{% endfor %}</table>
{% if comment %}<div style="margin:0 0 22px;padding:14px 16px;border-left:4px solid #f4c84a;background:#fff8df"><strong>HR comment</strong><br>{{ comment|linebreaksbr }}</div>{% endif %}
<p style="margin:0"><a href="{{ action_url }}" style="display:inline-block;padding:11px 18px;border-radius:6px;color:#fff;background:#087a5a;font-weight:700;text-decoration:none">{{ action_label }}</a></p>
</td></tr>
</table>
</td></tr></table>
</body>
</html>
