name: acmad/climweb CI/CD

# NOTE: this project has no repo-root requirements.txt/manage.py and requires
# PostGIS (not vanilla Postgres) plus a GDAL/GEOS toolchain matching the one
# baked into the project's own Dockerfile - installing those piecemeal on a
# bare ubuntu-latest runner is fragile and drifts from the Dockerfile over
# time. Instead this job builds and runs the same dev Docker image used
# locally (see Makefile's `make test` / `make up`), so CI stays in lockstep
# with whatever the Dockerfile/docker-compose.yml actually specify.

on:
  push:
    branches: [develop, production]
  pull_request:
    branches: [develop, production]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml requires a .env file (see .env.sample) - these are
      # throwaway, CI-only values for an ephemeral stack, never real secrets.
      - name: Create .env file for docker compose
        run: |
          cat <<'EOF' > .env
          CMS_DB_USER=climweb
          CMS_DB_NAME=climweb
          CMS_DB_PASSWORD=climweb
          POSTGRES_VERSION=15
          REDIS_PASSWORD=climweb
          SECRET_KEY=ci-only-secret-key-not-for-production-use
          CMS_DEBUG=True
          ALLOWED_HOSTS=*
          TIME_ZONE=UTC
          CMS_DEFAULT_LANGUAGE_CODE=en
          CMS_ADMIN_URL_PATH=cms-admin
          UID=1000
          GID=1000
          EOF

      # Start only the web service and its declared database/Redis
      # dependencies. The test suite does not need live Celery workers, and
      # starting the entire profile would make Compose wait for Celery's
      # `climweb_dev: service_healthy` dependency here. That moves web startup
      # failures into this opaque build step before the diagnostic readiness
      # step below can print the application logs.
      - name: Build and start the Django test services
        run: docker compose --profile dev up -d --build climweb_dev

      # Migrations run automatically on container startup (see
      # climweb/docker/docker-entrypoint.sh), so we just need to wait for
      # that startup sequence (db/redis wait + migrate + collectstatic) to
      # finish and the dev server to actually be listening.
      - name: Wait for climweb_dev to be ready
        run: |
          for i in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' climweb_dev 2>/dev/null || true)"

            case "$status" in
              healthy)
                echo "climweb_dev is ready"
                exit 0
                ;;
              unhealthy)
                echo "climweb_dev became unhealthy"
                docker compose --profile dev logs --no-color --timestamps climweb_dev
                docker compose --profile dev ps -a
                exit 1
                ;;
            esac

            # Report startup failures immediately instead of waiting for the
            # full timeout and hiding the application error behind Celery's
            # dependency-wait messages.
            if ! docker inspect --format '{{.State.Running}}' climweb_dev 2>/dev/null \
                | grep -qx true; then
              echo "climweb_dev stopped during startup"
              docker compose --profile dev logs --no-color --timestamps climweb_dev
              docker compose --profile dev ps -a
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for climweb_dev to become healthy"
          docker compose --profile dev logs --no-color --timestamps climweb_dev
          docker compose --profile dev ps -a
          exit 1

      - name: Run tests
        run: >
          docker compose --profile dev exec -T climweb_dev
          python /climweb/web/src/climweb/manage.py test
          --settings=climweb.config.settings.test --verbosity=2

      - name: Tear down
        if: always()
        run: docker compose --profile dev down -v
    
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'

    steps:
    - name: Copy SSH key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.VULTR_SSH_KEY }}

    - name: Deploy to Vultr
      run: |
        ssh -o StrictHostKeyChecking=no -p 2225 ${{ secrets.VULTR_USER }}@${{ secrets.VULTR_IP }} << 'EOF'
          set -e
          cd climweb
          git pull origin production

          # build the new prod image, then recreate the running prod containers
          # from it - `make up build-prod` (the old command here) never actually
          # restarted production with the new build, it only built the image and
          # separately brought up the unrelated *dev* profile.
          make build-prod
          make down-prod
          make up-prod

          # Clean up dangling images/containers only - NOT build cache.
          # `docker builder prune -af` here was wiping the pip cache mount
          # (see Dockerfile PIP_CACHE_DIR) on every single deploy, forcing a
          # full re-download of the ~1000 base.txt packages from PyPI each
          # time and making the build both slow and prone to read timeouts
          # on files.pythonhosted.org. Prune build cache on a separate,
          # infrequent schedule instead if disk usage becomes a problem.
          docker image prune -f
          docker container prune -f
        EOF
