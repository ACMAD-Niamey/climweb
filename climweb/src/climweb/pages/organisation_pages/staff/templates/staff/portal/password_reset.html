{% extends "staff/portal/base.html" %}
{% block content %}
<section class="portal-panel portal-narrow">
    <h1>Reset your password</h1>
    <p>Enter your staff account email address. If you have not accepted your invitation yet, ask the administrator to resend it.</p>
    <form method="post">{% csrf_token %}{{ form.as_p }}<button class="portal-button" type="submit">Send reset link</button></form>
</section>
{% endblock %}
