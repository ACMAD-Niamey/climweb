worker_processes auto;
error_log /var/log/nginx/error.log;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types text/plain text/css text/js text/xml text/javascript application/x-javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;
    gzip_disable "msie6";
    gzip_comp_level 6;

    client_max_body_size 4G;
    client_body_buffer_size 100M;

    large_client_header_buffers 16 2048k;

    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Every hostname here uses ONE Let's Encrypt certificate, issued with all of
    # them as SANs:
    #   certbot certonly --webroot -w /var/www/certbot --cert-name acmad.org \
    #     -d acmad.org -d www.acmad.org -d new.acmad.org -d summerschool.acmad.org
    # The cert path lives in deploy/nginx/ssl/ssl.conf (git-ignored, per host),
    # pulled in by `include /etc/nginx/ssl/ssl.conf;` in each server block — same
    # pattern as nginx.prod.ssl.conf. Point it at /etc/letsencrypt/live/acmad.org/.
    #
    # NOTE: `set $upstream ...` + resolver is deliberate — it forces nginx to
    # re-resolve the container name at request time instead of failing to boot
    # when climweb_prod is briefly down during a deploy.

    # --- HTTP: ACME challenge, then force HTTPS on the same host ---
    server {
        listen 80;
        listen [::]:80;
        server_name acmad.org www.acmad.org new.acmad.org summerschool.acmad.org;

        # Let's Encrypt HTTP-01 validation hits this over plain port 80 — it
        # must be served before the redirect below, or certbot renewals fail.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS: acmad.org — the canonical site ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl ipv6only=on;
        http2 on;
        server_name acmad.org;

        include /etc/nginx/ssl/ssl.conf;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        proxy_busy_buffers_size 512k;
        proxy_buffers 4 512k;
        proxy_buffer_size 256k;

        resolver 127.0.0.11 valid=30s;

        location / {
            set $upstream climweb_prod:8000;

            proxy_pass http://$upstream;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /static/ {
            alias /wagtail_static/;
        }

        location /media/ {
            alias /wagtail_media/;
        }
    }

    # --- HTTPS: www.acmad.org + legacy new.acmad.org → 301 to the apex ---
    # `new.acmad.org` is transitional — kept only so old links keep working.
    # To retire it: drop it from the server_name on port 80 above, delete this
    # block's `new.acmad.org` from server_name (or the block if www is split
    # out), and remove its DNS record.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name www.acmad.org new.acmad.org;

        include /etc/nginx/ssl/ssl.conf;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        return 301 https://acmad.org$request_uri;
    }

    # --- HTTPS: summerschool.acmad.org — serves the Summer School section ---
    # Same app and database as the main site, via Wagtail multi-site (see
    # docs/_docs/technical/subdomain-deployment.md).
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name summerschool.acmad.org;

        include /etc/nginx/ssl/ssl.conf;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        proxy_busy_buffers_size 512k;
        proxy_buffers 4 512k;
        proxy_buffer_size 256k;

        resolver 127.0.0.11 valid=30s;

        location / {
            set $upstream climweb_prod:8000;

            proxy_pass http://$upstream;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /static/ {
            alias /wagtail_static/;
        }

        location /media/ {
            alias /wagtail_media/;
        }
    }
}
