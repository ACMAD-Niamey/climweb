worker_processes auto;
error_log /var/log/nginx/error.log;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types text/plain text/css text/js text/xml text/javascript application/x-javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;
    gzip_disable "msie6";
    gzip_comp_level 6;

    client_max_body_size 4G;
    client_body_buffer_size 100M;

    large_client_header_buffers 16 2048k;

    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # ─────────────────────────────────────────────────────────────────────────
    # BOOTSTRAP config for the acmad.org apex switch.
    #
    # Use this while the acmad.org apex A record is not yet pointing at this
    # server (or hasn't propagated). www.acmad.org is the canonical host for
    # now; new.acmad.org redirects to it; summerschool.acmad.org keeps working.
    # All three share ONE certificate:
    #   certbot certonly --webroot -w /var/www/certbot --cert-name acmad.org \
    #     -d www.acmad.org -d new.acmad.org -d summerschool.acmad.org
    #
    # Once acmad.org resolves here:
    #   1. certbot ... --cert-name acmad.org --expand -d acmad.org -d www.acmad.org \
    #        -d new.acmad.org -d summerschool.acmad.org
    #      (the challenge is answered by the port-80 block below — it is the
    #      default server, so Host: acmad.org lands here)
    #   2. switch NGINX_CONFIG_PROD to nginx.prod.acmad.ssl.conf and reload
    #   3. .env: CMS_BASE_URL=https://acmad.org, add acmad.org to ALLOWED_HOSTS
    #      and CSRF_TRUSTED_ORIGINS; recreate climweb_prod
    #   4. Wagtail admin -> Settings -> Sites: default site hostname acmad.org
    # ─────────────────────────────────────────────────────────────────────────

    # NOTE: `set $upstream ...` + resolver forces per-request DNS resolution of
    # the container name, so nginx boots even when climweb_prod is briefly down.

    # --- HTTP: ACME challenge (incl. acmad.org once it resolves), then HTTPS ---
    server {
        listen 80;
        listen [::]:80;
        server_name acmad.org www.acmad.org new.acmad.org summerschool.acmad.org;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS: www.acmad.org — the site (canonical during bootstrap) ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl ipv6only=on;
        http2 on;
        server_name www.acmad.org;

        ssl_certificate     /etc/letsencrypt/live/acmad.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/acmad.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        proxy_busy_buffers_size 512k;
        proxy_buffers 4 512k;
        proxy_buffer_size 256k;

        resolver 127.0.0.11 valid=30s;

        location / {
            set $upstream climweb_prod:8000;

            proxy_pass http://$upstream;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /static/ {
            alias /wagtail_static/;
        }

        location /media/ {
            alias /wagtail_media/;
        }
    }

    # --- HTTPS: new.acmad.org → 301 to www.acmad.org ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name new.acmad.org;

        ssl_certificate     /etc/letsencrypt/live/acmad.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/acmad.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        return 301 https://www.acmad.org$request_uri;
    }

    # --- HTTPS: summerschool.acmad.org — serves the Summer School section ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name summerschool.acmad.org;

        ssl_certificate     /etc/letsencrypt/live/acmad.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/acmad.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        proxy_busy_buffers_size 512k;
        proxy_buffers 4 512k;
        proxy_buffer_size 256k;

        resolver 127.0.0.11 valid=30s;

        location / {
            set $upstream climweb_prod:8000;

            proxy_pass http://$upstream;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /static/ {
            alias /wagtail_static/;
        }

        location /media/ {
            alias /wagtail_media/;
        }
    }
}
