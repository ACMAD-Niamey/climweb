{% extends "staff/portal/base.html" %}
{% block content %}
<section class="portal-panel portal-narrow">
    <h1>Choose a new password</h1>
    {% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="portal-button" type="submit">Save password</button></form>
    {% else %}<p>This reset link is invalid or has expired.</p><a href="{% url 'staff_portal:password_reset' %}">Request another link</a>{% endif %}
</section>
{% endblock %}
